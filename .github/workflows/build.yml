name: Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach release artifacts on tag pushes

jobs:
  # ---------------------------------------------------------------------
  # Always runs: tests + debug build. Self-generates the debug keystore
  # and auto-detects whether to use ./gradlew or the system `gradle`
  # binary, so this never depends on repo files that may not exist.
  # ---------------------------------------------------------------------
  test-and-build-debug:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Detect Gradle command (wrapper vs system)
        id: gradle-cmd
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
            echo "Using project Gradle wrapper (./gradlew)."
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
            echo "No ./gradlew found — falling back to system Gradle."
          fi

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh debug.keystore for this run."
          else
            echo "debug.keystore already present, skipping generation."
          fi

      - name: Run Unit & Robolectric Tests
        run: ${{ steps.gradle-cmd.outputs.cmd }} :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Assemble Debug APK
        run: ${{ steps.gradle-cmd.outputs.cmd }} :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ---------------------------------------------------------------------
  # Only runs on version tag pushes (e.g. v1.0.0). Requires the four
  # release-signing secrets to already exist. This step is SUPPOSED to
  # fail loudly if they're missing — a password manager release must
  # never ship unsigned or debug-signed.
  # ---------------------------------------------------------------------
  release:
    name: Build & Publish Signed Release
    needs: test-and-build-debug
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Detect Gradle command (wrapper vs system)
        id: gradle-cmd
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing secrets are present
        run: |
          MISSING=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error ::Missing secret: $name is required for release signing."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Release keys are not configured yet. See the one-time setup steps."
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      - name: Build minified Release APK & AAB
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ${{ steps.gradle-cmd.outputs.cmd }} :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Clean up decoded keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Prepare release artifacts + checksums
        run: |
          mkdir -p release-artifacts
          find app/build/outputs -name "*release*.apk" -exec cp {} release-artifacts/VaultKeep-${{ github.ref_name }}.apk \;
          find app/build/outputs -name "*release*.aab" -exec cp {} release-artifacts/VaultKeep-${{ github.ref_name }}.aab \;
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f "CHANGELOG.md" ]; then
            awk "/## \[${VERSION}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.txt
          fi

      - name: Create GitHub Release & upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}